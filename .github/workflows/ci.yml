name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Use hoisted install strategy to match Windows development setup and
      # avoid symlink issues on case-sensitive file systems.
      npm_config_install_strategy: hoisted
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/neuroclaw_test

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: neuroclaw_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test (on Postgres 16)
        run: npm test

      - name: Web-layer coverage gate (ratchet tier 1)
        run: npx vitest run --coverage apps/web/src

      - name: Build
        run: npm run build

      - name: Assert web bundle is clean of server-only references
        run: npm run assert:bundle

      - name: Verify release manifest and asset hashes
        run: npm run assert:release

      - name: Audit dependencies (high severity gate)
        run: npm audit --audit-level=high

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: neuroclaw-p0-build
          path: |
            apps/*/dist
            packages/*/dist
            apps/web/dist
          if-no-files-found: warn
          retention-days: 7

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build

    env:
      npm_config_install_strategy: hoisted
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/neuroclaw_e2e

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: neuroclaw_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results
          if-no-files-found: warn
          retention-days: 7

  # I-038: guard that a production-only install (`npm ci --omit=dev`) still
  # resolves `semver` (^7.6.0, production dependency of @neuroclaw/shared) from
  # the shared context, and that the Node ESM named imports used by the
  # compiled dist (packages/shared/dist/semver-range.js) are callable at
  # runtime. Independent of `build` on purpose: runs in parallel, so it adds
  # no wall-clock time to the pipeline.
  prod-smoke:
    name: Production install smoke (shared · semver)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      npm_config_install_strategy: hoisted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Production install (omit dev)
        run: npm ci --omit=dev

      - name: Smoke · shared resolves and calls semver
        working-directory: packages/shared
        run: |
          node --input-type=module -e "
          import { intersects, satisfies, valid, validRange } from 'semver';
          import { createRequire } from 'node:module';
          const require = createRequire(import.meta.url);
          const version = require('semver/package.json').version;
          const resolved = require.resolve('semver');
          const expect = (cond, label) => { if (cond) { console.log('ok - ' + label); } else { console.error('SMOKE FAIL: ' + label); process.exit(1); } };
          expect(typeof intersects === 'function' && typeof satisfies === 'function' && typeof valid === 'function' && typeof validRange === 'function', 'named ESM imports callable');
          expect(satisfies(version, '^7.6.0'), 'installed semver ' + version + ' satisfies shared contract ^7.6.0');
          expect(valid('1.2.3') === '1.2.3' && valid('1.2') === null, 'valid() semantics');
          expect(validRange('^1.0.0') !== null && validRange('not-a-range') === null, 'validRange() semantics');
          expect(satisfies('1.2.3', '^1.0.0') === true && satisfies('2.0.0', '^1.0.0') === false, 'satisfies() semantics');
          expect(intersects('^1.0.0', '^2.0.0') === false && intersects('^1.0.0', '^1.2.0') === true, 'intersects() semantics');
          console.log('PROD SMOKE OK - semver ' + version + ' resolved at ' + resolved);
          "
